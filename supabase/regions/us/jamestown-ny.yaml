# Pilot region for the open-data base layer.
# Jamestown, New York is the demo city (PLAN §10 question 3). The importer
# does not special-case this file: any other region is another YAML like it.
# bbox is west, south, east, north (longitude, latitude).

region:
  id: us-ny-jamestown
  name: Jamestown, New York, USA
  country: US
  bbox: [-79.32, 42.05, -79.18, 42.14]
  timezone: America/New_York

# Free live layers for this box. weather_alerts.provider is nws or none.
# Another country adds a provider id in the app and names it here.
live:
  weather_alerts:
    provider: nws

sources:
  - id: wikipedia-geo
    adapter: wikipedia_geo
    publisher: Wikimedia Foundation
    url: https://en.wikipedia.org/
    license: CC BY-SA 4.0
    attribution: "Wikipedia contributors, CC BY-SA 4.0. Titles and coordinates only; article text is not copied."
    automated_access: allowed
    cost: 0
    language: en
    radius_m: 10000
    category: historical_fact
  - id: wikidata-geo
    adapter: wikidata_geo
    publisher: Wikidata
    url: https://www.wikidata.org/
    license: CC0 1.0
    attribution: "Wikidata contributors, CC0 1.0."
    automated_access: allowed
    cost: 0
    category: historical_fact
  - id: nrhp
    adapter: arcgis_feature
    publisher: U.S. National Park Service
    url: https://mapservices.nps.gov/arcgis/rest/services/cultural_resources/nrhp_locations/MapServer
    license: Public domain
    attribution: "National Park Service, National Register of Historic Places. Public domain."
    automated_access: allowed
    cost: 0
    layers: [0, 1]
    category: historical_fact
    fields:
      id: NRIS_Refnum
      title: RESNAME
      url: NARA_URL
      city: City
      state: State
      kind: ResType
      address: Address
  - id: osm-heritage
    adapter: osm_overpass
    publisher: OpenStreetMap contributors
    url: https://www.openstreetmap.org/copyright
    license: ODbL 1.0
    attribution: "© OpenStreetMap contributors. Data available under the Open Database License."
    automated_access: allowed
    cost: 0
    historic: true
    heritage: true
    tourism: [artwork, attraction, museum, viewpoint, gallery]
  - id: osm-historical-markers
    adapter: osm_historical_markers
    publisher: OpenStreetMap contributors
    url: https://www.openstreetmap.org/copyright
    license: ODbL 1.0
    attribution: "© OpenStreetMap contributors. Historical markers under the Open Database License. HMdb text is not copied; a marker may link out to HMdb."
    automated_access: allowed
    cost: 0
    category: historical_marker
  - id: osm-accessibility
    adapter: osm_accessibility
    publisher: OpenStreetMap contributors
    url: https://www.openstreetmap.org/copyright
    license: ODbL 1.0
    attribution: "© OpenStreetMap contributors. Data available under the Open Database License."
    automated_access: allowed
    cost: 0
    # Kept out of the main open-data snapshot so a wheelchair tag is not deduped
    # away from the building it describes. Checked as its own seed file.
    snapshot: jamestown-ny-access.json

# Project Sidewalk is optional. Turn enabled on only in a city that publishes
# a dump (https://sidewalk-gallery.cs.washington.edu/). Jamestown does not.
accessibility:
  project_sidewalk:
    enabled: false

# A walk is ordered stops that name places already in the snapshot.
# source + external_id match seed/open-data/jamestown-ny.json.
# The applied row is seed/walks/jamestown-ny.sql. Another region adds its own.
walks:
  - slug: downtown-history
    title: Downtown Jamestown history walk
    description: "A walk past public records in downtown Jamestown, New York. Each stop is a place already on the map. National Register stops are a building or a district in Jamestown, New York. Wikipedia stops are articles about the named place. The distance is the straight line between those published points."
    stops:
      - position: 1
        source: nrhp
        external_id: "nrhp:03000045"
        title: Erie Railroad Station
      - position: 2
        source: wikipedia-geo
        external_id: "enwiki:58462917"
        title: National Comedy Center
      - position: 3
        source: wikipedia-geo
        external_id: "enwiki:27747830"
        title: The Wellman Building
      - position: 4
        source: wikipedia-geo
        external_id: "enwiki:10959769"
        title: Lucille Ball Desi Arnaz Museum & Center for Comedy
      - position: 5
        source: wikipedia-geo
        external_id: "enwiki:64045862"
        title: Reg Lenna Center for the Arts
      - position: 6
        source: nrhp
        external_id: "nrhp:14000935"
        title: Jamestown Downtown Historic District
      - position: 7
        source: wikipedia-geo
        external_id: "enwiki:47375466"
        title: Robert H. Jackson Center
      - position: 8
        source: nrhp
        external_id: "nrhp:100011762"
        title: First Presbyterian Church, Jamestown, New York

# Town Hall. One block per region. Jamestown has no Legistar client, no
# AgendaCenter, and no open building-permit table, so the source is the
# curated file. Another town swaps the adapter. See docs/TOWN-HALL.md.
civic:
  sources:
    - id: jamestown-city-record
      adapter: manual
      publisher: City of Jamestown
      url: https://www.jamestownny.gov/city-council/meeting-schedule/
      license: Public record
      attribution: "City of Jamestown. Headline and link only. Numbered-street coordinates are from the U.S. Census Bureau geocoder (public domain)."
      automated_access: allowed
      cost: 0
      file: supabase/seed/civic/jamestown-ny.manual.yaml
      body: City Council

# Founding Locals and the time-boxed map campaign.
# Applied by seed/campaigns/jamestown-ny.sql. Another region copies this block.
# starts_at null means the seed starts the clock when it is applied.
programs:
  founding:
    cap: 25
  campaign:
    slug: map-jamestown
    title: Map Jamestown
    description: "Add real drops in Jamestown over 14 days. Public records already on the map do not count."
    goal_drops: 200
    duration_days: 14
    starts_at: null
    leaderboard_size: 8

# Time Machine and "This day here". The importer reads this block.
# Another town copies it and changes the names. control points live in
# jamestown-ny.georef.json, not here, so an empty list does not draw a map.
history:
  town: Jamestown
  state: New York
  sanborn:
    collection: sanborn-maps
    location:
      - jamestown
      - new york
  photos:
    loc:
      collection: photos
      location:
        - jamestown
        - new york
      limit: 24
    commons:
      enabled: true
      radius_m: 600
      limit: 8
  newspapers:
    state: New York
    city: Jamestown
    seed_queries:
      - West 3rd Street
      - Main Street
      - Prendergast Avenue

candidates:
  - id: hmdb
    decision: link-only
    reason: "HMdb copyright allows non-commercial copying with attribution only. Commercial use needs written permission. Do not import marker text."
    url: https://www.hmdb.org/copyright.asp
  - id: atlas-obscura
    decision: link-only
    reason: "No open-data license was found. Link out only. Do not copy place text."
    url: https://www.atlasobscura.com/about
  - id: project-sidewalk
    decision: reject
    reason: "Checked 2026-10-19. Project Sidewalk publishes open sidewalk labels (curb ramps, missing ramps, obstacles, surface problems) only for cities that have run a campaign. The gallery and the public city list do not include Jamestown, New York. The adapter project_sidewalk is in the importer. Set accessibility.project_sidewalk.enabled to true, with an https url, license, attribution, and a local GeoJSON file, only when a region has that dump. Do not guess labels."
    url: https://sidewalk-gallery.cs.washington.edu/
  - id: jamestown-311
    decision: reject
    reason: "Checked 2026-10-18. Jamestown NY is not on the Open311 GeoReport server list (https://wiki.open311.org/GeoReport_v2/Servers/). No New York city is listed. jamestownny.gov has no open 311 or SeeClickFix service-request API. Police annual reports are PDFs of calls for service and are person-related, so they are not imported. data.ny.gov 311 Service Requests is New York City (erm2-nwe9), not Jamestown. The SeeClickFix issues API returned 403 and is not a free open feed. No civic feed is configured."
    url: https://wiki.open311.org/GeoReport_v2/Servers/
  - id: jamestown-legistar
    decision: reject
    reason: "Checked 2026-10-19. https://webapi.legistar.com/v1/jamestown/bodies and /chautauqua/bodies return HTTP 500 (LegistarConnectionString is not set up). No Jamestown or Chautauqua Legistar client. The legistar adapter stays in the importer for cities that have one. robots.txt on webapi.legistar.com was 404."
    url: https://webapi.legistar.com/v1/jamestown/bodies
  - id: jamestown-agendacenter
    decision: reject
    reason: "Checked 2026-10-19. https://www.jamestownny.gov/AgendaCenter returns 404. Agendas are hosted on eCode360, not CivicPlus AgendaCenter."
    url: https://www.jamestownny.gov/AgendaCenter
  - id: jamestown-ecode360
    decision: link-only
    reason: "Checked 2026-10-19. Council agendas are listed at https://ecode360.com/JA1371/documents/Agendas. A fetch of ecode360 robots.txt returned HTTP 403 (Cloudflare). Do not crawl the site. One already-public PDF may be linked by its stable URL. Do not copy resolution text."
    url: https://ecode360.com/JA1371/documents/Agendas
  - id: jamestown-calendar-export
    decision: reject
    reason: "jamestownny.gov robots.txt disallows /calendar/action~* and the ai1ec exporter. Do not pull the calendar iCal or JSON export. The meeting-schedule page and the news RSS are allowed."
    url: https://www.jamestownny.gov/robots.txt
  - id: jamestown-building-permits
    decision: reject
    reason: "Checked 2026-10-19. Permits are filed through GovPilot (https://eforms-main.govpilot.com/NY/jamestowncityny), an application portal, not an open dataset. data.ny.gov catalog search (domains=data.ny.gov, q=permit) has no Jamestown or Chautauqua building-permit table. Federated hits are other cities. data.ny.gov robots.txt allows the API with a crawl delay. The socrata and arcgis_permits adapters stay for regions that publish a dataset."
    url: https://data.ny.gov/
  - id: chautauqua-planning-agendas
    decision: reject
    reason: "Checked 2026-10-19. https://planningchautauqua.com/planning/cpb/minutes-agendas/ returned HTTP 403. Do not crawl it. The October 6, 2026 planning board met at the Jamestown airport, which is north of the Jamestown region box, and that date is past. No later meeting was invented."
    url: https://planningchautauqua.com/planning/cpb/minutes-agendas/
