name: android

on:
  push:
    paths:
      - "android/**"
      - "shared/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "shared/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  shared:
    name: shared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # AGP needs the Android SDK to compile the android target. Platforms only:
      # this module has no resources that need build-tools. iOS targets are
      # declared in shared/build.gradle.kts and are not compiled here (no Xcode
      # on the Linux runner). kotlin.native.ignoreDisabledTargets skips them.
      - name: Install Android SDK platform 36
        run: |
          set -euo pipefail
          VERSION=13114758
          SHA256=7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLf -o /tmp/commandlinetools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${VERSION}_latest.zip"
          echo "${SHA256}  /tmp/commandlinetools.zip" | sha256sum -c -
          unzip -q /tmp/commandlinetools.zip -d /tmp/android-clt
          mv /tmp/android-clt/cmdline-tools "$SDK/cmdline-tools/latest"
          # `yes` exits 141 when sdkmanager closes the pipe. The directory check is the result.
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-36" || true
          test -d "$SDK/platforms/android-36"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and assemble shared
        run: ./gradlew :shared:jvmTest :shared:koverVerify :shared:assembleAndroidMain
