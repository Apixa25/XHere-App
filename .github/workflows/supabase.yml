name: supabase

on:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"

permissions:
  contents: read

jobs:
  # Edge functions do not need the database containers. Deno tests fake the
  # RPCs and Storage, and they do not download gte-small weights.
  functions:
    name: functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Deno
        run: |
          set -euo pipefail
          VERSION=2.1.4
          SHA256=54a81939cccb2af114c4d0a68a554cf4a04b1f08728e70f663f83781de19d785
          curl -sSLf -o /tmp/deno.zip \
            "https://github.com/denoland/deno/releases/download/v${VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${SHA256}  /tmp/deno.zip" | sha256sum -c -
          unzip -q /tmp/deno.zip -d /tmp/deno-bin
          sudo mv /tmp/deno-bin/deno /usr/local/bin/deno
          deno --version

      - name: Test and typecheck Edge Functions
        run: |
          set -euo pipefail
          deno test --allow-net supabase/functions
          deno check supabase/functions/suggest-category/index.ts
          deno check supabase/functions/strip-exif/index.ts
          deno check supabase/functions/public-api/index.ts

  # The importer is stdlib Python. This job does not call the network and
  # does not start Docker. It checks the committed Jamestown snapshot
  # against the region file.
  open-data:
    name: open-data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the importer and the Jamestown snapshot
        run: |
          set -euo pipefail
          python3 supabase/scripts/import_open_data.py --self-test
          python3 supabase/scripts/import_open_data.py \
            --check supabase/seed/open-data/jamestown-ny.json \
            --region supabase/regions/us/jamestown-ny.yaml

  pgtap:
    name: pgtap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Free Supabase CLI, pinned by version and checksum. It runs the local
      # stack in Docker on the runner; no Supabase account or project is used.
      - name: Install Supabase CLI
        run: |
          set -euo pipefail
          VERSION=2.121.0
          SHA256=f6e10fc4086390ca386127bb4fd1a5e578625f95e7db84255a6bb82a159f973f
          curl -sSLf -o /tmp/supabase.deb \
            "https://github.com/supabase/cli/releases/download/v${VERSION}/supabase_${VERSION}_linux_amd64.deb"
          echo "${SHA256}  /tmp/supabase.deb" | sha256sum -c -
          sudo dpkg -i /tmp/supabase.deb
          supabase --version

      # Only Postgres is needed for migrations and pgTAP, so the API, Auth,
      # Storage, Realtime, and Studio containers are skipped.
      - name: Start local Supabase (database only)
        run: >-
          supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Reset database (migrations + seed)
        run: supabase db reset

      - name: Lint SQL functions (plpgsql_check)
        run: supabase db lint --schema public,private --level warning --fail-on warning

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
