org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# iOS targets are declared for M15. Linux CI cannot compile them; do not fail the build
# when the host has no Xcode. See docs/PLAN.md section 1.1 and milestone M2.
kotlin.native.ignoreDisabledTargets=true

# commonTest runs on the JVM target (PLAN M2). That is the suite CI executes.
# Android host tests would be a second copy of the same sources.
android.sync.suppressAgpWarnings=GENERIC

kotlin.mpp.applyDefaultHierarchyTemplate=true
